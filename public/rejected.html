<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // LOVE NOT FOUND</title>
  <link rel="stylesheet" href="/css/style.css?v=orange">
  <style>
    body {
      background-color: #ffd0dc !important;
      background-image: linear-gradient(180deg, #ffe8f0 0%, #ffccd8 100%) !important;
      background-attachment: fixed !important;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 560px; text-align: center; margin-top: 40px;">
    <div class="card" style="padding: 40px 30px;">
      <div class="badge" style="background: #fef2f2; border-color: #fecaca; color: #dc2626; font-family: 'Space Grotesk', monospace, sans-serif; font-weight: 700; letter-spacing: 0.5px;">ERROR 404;</div>
      <h1 style="font-size: 38px; font-weight: 900; color: var(--text-main); margin-bottom: 28px; line-height: 1.1; letter-spacing: -0.5px;">
        LOVE<br>NOT FOUND
      </h1>
      <a href="/index.html?reset=true" onclick="handleBackToLogin(event)" class="btn btn-primary" style="display: inline-block; width: auto; padding: 12px 28px; text-decoration: none;">
        Back to Login Page &rarr;
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2026 Pruthviraj &bull; BSc Computer Science &bull; Kristu Jayanti</p>
    </footer>
  </div>

  <script>
    async function handleBackToLogin(e) {
      if (e) e.preventDefault();
      try {
        await fetch('/api/auth', { method: 'DELETE' });
      } catch (err) {}
      localStorage.removeItem('applicant_id');
      localStorage.removeItem('applicant_status');
      window.location.href = '/index.html?reset=true';
    }
  </script>
</body>
</html>
