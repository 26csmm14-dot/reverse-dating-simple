<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center // Reverse Dating</title>
  <link rel="stylesheet" href="/css/style.css?v=orange">
  <style>
    body {
      background-color: #ffd0dc !important;
      background-image: linear-gradient(180deg, #ffe8f0 0%, #ffccd8 100%) !important;
      background-attachment: fixed !important;
    }
    .admin-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 30px 20px 80px 20px;
    }
    .admin-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    .metric-number {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .metric-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .search-input {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 13px;
      width: 240px;
    }
    .applicant-card {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }
    .applicant-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-color: #f7aabf;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .cand-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .cand-handle {
      font-size: 13px;
      color: var(--accent-text);
      font-weight: 600;
    }
    .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pending {
      background: #ffedd5;
      color: #ea580c;
      border: 1px solid #fed7aa;
    }
    .status-accepted {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .status-rejected {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .status-viewing {
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
      background: #fdf8fa;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid #fce7ef;
    }
    .info-item-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .info-item-value {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }
    .pitch-quote {
      background: #fff7ed;
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-style: italic;
      color: #7c2d12;
      margin-bottom: 18px;
    }
    .card-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-accept {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn-accept:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-reject {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-reject:hover {
      background: #fef2f2;
      border-color: #dc2626;
    }
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1f2937;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .toast-popup.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Navigation Bar -->
    <header class="admin-nav">
      <div class="nav-brand">
        <span class="status-dot" title="Live Auto-Polling Active"></span>
        <div>
          <strong style="font-size: 16px; color: var(--text-main);">Reverse Dating // Command Center</strong>
          <div style="font-size: 12px; color: var(--text-dim);">Live Host Decision Panel &bull; Pruthviraj</div>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <span id="pollIndicator" style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Live polling active (3s)</span>
        <a href="/dashboard.html" target="_blank" class="btn btn-secondary" style="padding: 6px 16px; font-size: 12px; text-decoration: none;">View Pitch Deck &rarr;</a>
      </div>
    </header>

    <!-- Metrics Bar -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-number" id="metricTotal" style="color: var(--text-main);">0</div>
        <div class="metric-label">Total Applicants</div>
      </div>
      <div class="metric-card" style="border-color: #fed7aa; background: #fffaf0;">
        <div class="metric-number" id="metricPending" style="color: var(--accent-text);">0</div>
        <div class="metric-label">Pending Decisions</div>
      </div>
      <div class="metric-card" style="border-color: #a7f3d0; background: #f0fdf4;">
        <div class="metric-number" id="metricAccepted" style="color: #059669;">0</div>
        <div class="metric-label">Matches Agreed</div>
      </div>
      <div class="metric-card" style="border-color: #fecaca; background: #fff5f5;">
        <div class="metric-number" id="metricRejected" style="color: #dc2626;">0</div>
        <div class="metric-label">Rejected (404)</div>
      </div>
    </section>

    <!-- Filter & Search Bar -->
    <section class="filter-bar">
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">All Applicants (<span id="countAll">0</span>)</button>
        <button class="tab-btn" data-filter="pending" onclick="setFilter('pending')">Pending (<span id="countPending">0</span>)</button>
        <button class="tab-btn" data-filter="accepted" onclick="setFilter('accepted')">Accepted (<span id="countAccepted">0</span>)</button>
        <button class="tab-btn" data-filter="rejected" onclick="setFilter('rejected')">Rejected (<span id="countRejected">0</span>)</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search candidate or handle..." oninput="renderApplicants()">
    </section>

    <!-- Applicants List Container -->
    <main id="applicantsList">
      <div style="text-align: center; padding: 60px 20px; background: #ffffff; border-radius: var(--radius); border: 1px solid var(--border-color);">
        <p style="color: var(--text-muted); font-size: 15px;">Loading applications from MongoDB Atlas...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 40px; text-align: center;">
      <p>&copy; 2026 Pruthviraj &bull; BSc Computer Science &bull; Kristu Jayanti</p>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-popup"></div>

  <script>
    let applicantsData = [];
    let currentFilter = 'all';

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      setTimeout(() => {
        toast.classList.remove('visible');
      }, 3500);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
      });
      renderApplicants();
    }

    async function fetchApplicants() {
      try {
        const res = await fetch('/api/admin/applicants');
        const data = await res.json();
        if (data.success && Array.isArray(data.applicants)) {
          applicantsData = data.applicants;
          updateMetrics();
          renderApplicants();
        }
      } catch (err) {
        console.warn('[Admin] Fetch error:', err);
      }
    }

    function updateMetrics() {
      const total = applicantsData.length;
      const pending = applicantsData.filter(a => a.status === 'pending').length;
      const accepted = applicantsData.filter(a => a.status === 'accepted').length;
      const rejected = applicantsData.filter(a => a.status === 'rejected').length;

      document.getElementById('metricTotal').textContent = total;
      document.getElementById('metricPending').textContent = pending;
      document.getElementById('metricAccepted').textContent = accepted;
      document.getElementById('metricRejected').textContent = rejected;

      document.getElementById('countAll').textContent = total;
      document.getElementById('countPending').textContent = pending;
      document.getElementById('countAccepted').textContent = accepted;
      document.getElementById('countRejected').textContent = rejected;
    }

    function formatTime(timestamp) {
      if (!timestamp) return 'Recent';
      const d = new Date(timestamp);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderApplicants() {
      const listEl = document.getElementById('applicantsList');
      const searchQuery = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      let filtered = applicantsData;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(a => a.status === currentFilter);
      }
      if (searchQuery) {
        filtered = filtered.filter(a => 
          (a.name && a.name.toLowerCase().includes(searchQuery)) ||
          (a.contact && a.contact.toLowerCase().includes(searchQuery)) ||
          (a.firstDateIdea && a.firstDateIdea.toLowerCase().includes(searchQuery))
        );
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div style="text-align: center; padding: 50px 20px; background: #ffffff; border-radius: var(--radius); border: 1px solid var(--border-color);">
            <h3 style="font-size: 18px; color: var(--text-main); margin-bottom: 6px;">No candidates found</h3>
            <p style="color: var(--text-muted); font-size: 14px;">No applications match the current filter or search criteria.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(cand => {
        const status = cand.status || 'viewing';
        const statusClass = 'status-' + status;
        const platform = cand.contactType ? cand.contactType.toUpperCase() : 'INSTAGRAM';
        const contact = cand.contact || 'No handle provided';
        const dateIdea = cand.firstDateIdea || 'Open to Ideas';
        const pitch = cand.pitch || 'No custom note attached.';
        const time = formatTime(cand.appliedAt || cand.createdAt);

        let directLink = '#';
        if (cand.contactType === 'instagram') directLink = `https://instagram.com/${contact.replace(/^@/, '')}`;
        if (cand.contactType === 'telegram') directLink = `https://t.me/${contact.replace(/^@/, '')}`;
        if (cand.contactType === 'snapchat') directLink = `https://snapchat.com/add/${contact}`;
        if (cand.contactType === 'whatsapp') directLink = `https://wa.me/${contact.replace(/[^0-9]/g, '')}`;

        return `
          <div class="applicant-card" id="card-${cand.id}">
            <div class="card-top">
              <div>
                <div class="cand-name">${escapeHtml(cand.name)}</div>
                <div class="cand-handle">
                  ${platform}: <a href="${directLink}" target="_blank" rel="noopener noreferrer" style="color: var(--accent-text); text-decoration: underline;">${escapeHtml(contact)}</a>
                  &bull; <span style="color: var(--text-dim);">${time}</span>
                </div>
              </div>
              <span class="status-pill ${statusClass}">${status}</span>
            </div>

            <div class="info-grid">
              <div>
                <div class="info-item-label">Selected First Date Idea</div>
                <div class="info-item-value">${escapeHtml(dateIdea)}</div>
              </div>
              <div>
                <div class="info-item-label">Candidate Expectations</div>
                <div class="info-item-value">${escapeHtml(cand.expectations || 'Standard')}</div>
              </div>
            </div>

            <div class="pitch-quote">
              "${escapeHtml(pitch)}"
            </div>

            <div class="card-actions">
              <span style="font-size: 12px; color: var(--text-dim); margin-right: auto;">
                ${cand.decidedAt ? 'Decided on ' + formatTime(cand.decidedAt) : 'Pending host decision'}
              </span>
              <button class="btn-reject" onclick="makeDecision('${cand.id}', 'reject', '${escapeHtml(cand.name)}')">
                Reject (404)
              </button>
              <button class="btn-accept" onclick="makeDecision('${cand.id}', 'accept', '${escapeHtml(cand.name)}')">
                Agree (Accept) &rarr;
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function makeDecision(applicantId, action, name) {
      try {
        const res = await fetch('/api/admin/decide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ applicantId, action }),
        });
        const data = await res.json();
        if (data.success) {
          showToast(action === 'accept' ? `${name} accepted! Candidate screen transitioning to celebration.` : `${name} rejected. Candidate screen transitioning to 404.`);
          await fetchApplicants();
        } else {
          alert('Failed to record decision: ' + (data.error || 'Server error'));
        }
      } catch (err) {
        alert('Network error while recording decision: ' + err.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial load
    fetchApplicants();

    // Auto polling every 3 seconds for live updates
    setInterval(fetchApplicants, 3000);
  </script>
</body>
</html>
